<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RoboAdvisor</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <div class="login-container">
        <!-- Logo/Brand -->
        <div class="brand-section">
            <a href="landing.html" class="logo-link">
                <div class="logo-icon">💼</div>
                <span class="logo-text">RoboAdvisor</span>
            </a>
            <h1 class="welcome-title">Welcome Back</h1>
            <p class="welcome-subtitle">Sign in to continue your conversation with your financial advisor</p>
        </div>

        <!-- Login Form -->
        <div class="form-container">
            <div class="form-card">
                <!-- Tab Switcher -->
                <div class="tab-switcher">
                    <button class="tab-btn active" id="loginTab">Sign In</button>
                    <button class="tab-btn" id="signupTab">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            class="form-input" 
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        />
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password" id="forgotPassword">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </button>
                    <div id="loginError" class="error-message" style="display: none;"></div>
                </form>

                <!-- Signup Form -->
                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            class="form-input" 
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            class="form-input" 
                            placeholder="Create a password (min. 6 characters)"
                            required
                            autocomplete="new-password"
                            minlength="6"
                        />
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Confirm your password"
                            required
                            autocomplete="new-password"
                        />
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="signupBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </button>
                    <div id="signupError" class="error-message" style="display: none;"></div>
                    <div id="signupSuccess" class="success-message" style="display: none;"></div>
                </form>

                <!-- Quick Test Users (Development Only) -->
                <div class="test-users" id="testUsers">
                    <div class="test-users-divider">
                        <span>Quick Test Accounts</span>
                    </div>
                    <div class="test-user-buttons">
                        <button class="test-user-btn" data-email="test@approved.com" data-password="test123456">
                            <span class="test-user-badge approved">✓</span>
                            Approved User
                        </button>
                        <button class="test-user-btn" data-email="test@blocked.com" data-password="test123456">
                            <span class="test-user-badge blocked">⚠</span>
                            Blocked User
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer Links -->
            <div class="form-footer">
                <p class="footer-switch" id="footerSwitchToSignup" style="display: none;">
                    Don't have an account? <a href="#" id="switchToSignup">Sign up</a>
                </p>
                <p class="footer-switch" id="footerSwitchToLogin">
                    Already have an account? <a href="#" id="switchToLogin">Sign in</a>
                </p>
                <a href="landing.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Authenticating...</p>
    </div>

    <!-- Supabase Configuration -->
    <!-- IMPORTANT: Create a config.js file with your Supabase credentials -->
    <!-- See config.example.js for instructions -->
    <script src="config.js" onerror="console.warn('config.js not found. Please create it with your Supabase credentials.')"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
